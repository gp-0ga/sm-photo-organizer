<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#163a5f" />
    <title>資産切替マーカー</title>
    <script type="module" crossorigin src="/assets/capture-DNJEE-XW.js"></script>
    <link rel="modulepreload" crossorigin href="/assets/qr-DFKATIpW.js">
    <link rel="stylesheet" crossorigin href="/assets/qr-jltPy7eq.css">
  </head>
  <body class="marker-site">
    <header class="app-header">
      <div>
        <p class="eyebrow">施設調査</p>
        <h1>資産切替マーカー</h1>
      </div>
      <span class="local-badge">端末内で作成</span>
    </header>

    <main class="marker-main">
      <section class="panel marker-load-panel" aria-labelledby="marker-excel-heading">
        <div class="step-label">1</div>
        <div class="step-body">
          <h2 id="marker-excel-heading">資産一覧を読み込む</h2>
          <p>健全度判定表の「No11」から資産番号と資産名を読み取ります。Excelは送信せず、この端末内だけで処理します。</p>
          <label class="file-picker marker-file-picker">
            <span>Excelを選択</span>
            <input id="marker-excel-input" type="file" accept=".xlsx" />
          </label>
          <div id="marker-excel-status" class="status neutral" role="status">Excelを選択してください。</div>
        </div>
      </section>

      <section id="marker-view-panel" class="panel" aria-labelledby="marker-view-heading" hidden>
        <div class="step-label">2</div>
        <div class="step-body">
          <div class="section-heading-row marker-heading-row">
            <div>
              <h2 id="marker-view-heading">撮影するマーカーを表示する</h2>
              <p>資産を選び、表示されたカード全体をiPhoneの標準カメラで1枚撮影します。</p>
            </div>
            <button id="marker-print" class="secondary" type="button">全マーカーを印刷</button>
          </div>

          <label class="marker-select-label" for="marker-asset-select">表示する資産</label>
          <select id="marker-asset-select" class="camera-asset-select"></select>

          <article id="marker-display" class="marker-display" aria-live="polite">
            <strong class="marker-start-text">ここからこの資産</strong>
            <img id="marker-display-qr" alt="" />
            <strong id="marker-display-number" class="marker-display-number"></strong>
            <span id="marker-display-name" class="marker-display-name"></span>
          </article>

          <div class="marker-nav">
            <button id="marker-previous" class="secondary" type="button">前の資産</button>
            <span id="marker-position"></span>
            <button id="marker-next" class="primary" type="button">次の資産</button>
          </div>
          <p class="marker-note">QRの読取り操作は不要です。このカードを写真として撮るだけで、PCでの振り分け時に切替マーカーになります。</p>
        </div>
      </section>

      <section id="marker-print-panel" class="panel marker-print-panel" aria-labelledby="marker-print-heading" hidden>
        <div class="step-label">3</div>
        <div class="step-body">
          <h2 id="marker-print-heading">印刷するマーカー一覧</h2>
          <p>画面で確認する場合は、カードを選ぶと上に大きく表示されます。</p>
          <div id="marker-card-list" class="marker-grid"></div>
        </div>
      </section>
    </main>

  </body>
</html>
